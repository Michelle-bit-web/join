<div class="form-group">
  <label for="filepicker">Attachments</label>
  <p class="upload-info">Only image files allowed</p>
  <button
    type="button"
    aria-label="Upload task images"
    class="upload-input-container"
    (click)="openFileDialog()"
    [class.drag-over]="isDragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <img
      class="upload-icon"
      src="assets/img/icons/upload.png"
      alt="upload icon"
    />
    <p>Drag a file or browse</p>
    <span>Upload file</span>
  </button>
  <input
    type="file"
    id="filepicker"
    name="uploadInput"
    placeholder="Upload files"
    accept="image/*"
    (change)="onFileSelected($event)"
    multiple
    [maxLength]="5"
    #filepicker
    hidden
  />
  <div
    class="file-list-container"
    *ngIf="uploadedImages.length > 0 || preloadedImages.length > 0"
  >
    <div class="clear-btn-container">
      <button
        type="button"
        class="clear-btn"
        aria-label="Clear selected images"
        (click)="removeAllImages(); $event.stopPropagation()"
      >
        <svg
          class="cancel-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <mask
            id="mask0_331509_883"
            style="mask-type: alpha"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="24"
            height="24"
          >
            <rect width="24" height="24" fill="#D9D9D9" />
          </mask>
          <g mask="url(#mask0_331509_883)">

              fill="#2A3647"
            />
          </g>
        </svg>
      </button>
    </div>
    <div class="image-grid">
      <div
        class="image-item"
        *ngFor="let image of uploadedImages; let i = index"
        (click)="openImageViewer(i)"
      >
        <img
          [src]="image.base64"
          [alt]="image.filename"
          class="preview-image"
        />
        <p class="image-filename">{{ image.filename }}</p>
        <div class="image-overlay">
          <button

            class="remove-btn"
            (click)="removeImage(i, 'uploaded'); $event.stopPropagation()"

      </div>

        *ngFor="let img of preloadedImages; let i = index"
        (click)="openImageViewer(i)"

          >

                />

        </div>
      </div>
    </div>
  </div>
  <div
    class="error-message"
    *ngIf="errorMessages.length > 0"
    aria-live="polite"
  >
    <p *ngFor="let msg of errorMessages">{{ msg }}</p>
  </div>
</div>
<app-image-viewer
  *ngIf="showImageViewer"
  [images]="getAllImageBase64()"
  [imageKeys]="getAllImageKeys()"
  [allowDelete]="true"
  (close)="closeImageViewer($event)"
  (deleteImage)="onDeleteImage($event)"
>
</app-image-viewer>
