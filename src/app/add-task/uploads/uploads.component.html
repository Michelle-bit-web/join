<div class="form-group">
  <label for="uploads">Attachments</label>
  <p class="upload-info">Only image files allowed</p>
  <div
    class="upload-input-container"
    (click)="openFileDialog()"
    [class.drag-over]="isDragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <img
      class="upload-icon"
      src="assets/img/icons/upload.png"
      alt="upload icon"
    />
    <p>Drag a file or browse</p>
    <span>Upload file</span>
    <input
      type="file"
      id="filepicker"
      name="uploadInput"
      placeholder="Upload files"
      accept="image/*"
      (change)="onFileSelected($event)"
      multiple
      [maxLength]="10"
      #filepicker
    />
  </div>
  <div
    class="file-list-container"
    *ngIf="uploadedImages.length > 0 || preloadedImages.length > 0"
  >
    <div class="close-btn-container">
      <img
        src="assets/img/icons/close.png"
        alt="Cancel"
        class="cancel-icon"
        (click)="clearSelectedImages()"
      />
    </div>
    <div class="image-grid">
      <div
        class="image-item"
        *ngFor="let image of uploadedImages; let i = index"
        (click)="openImageViewer(i)"
      >
        <img
          [src]="image.base64"
          [alt]="image.filename"
          class="preview-image"
        />
        <div class="image-overlay">
          <button
            class="remove-btn"
            (click)="removeImage(i); $event.stopPropagation()"
          >
            <svg>...</svg>
          </button>
        </div>
      </div>
      <div
        class="image-item"
        *ngFor="let img of preloadedImages; let i = index"
        (click)="openImageViewer(i)"
      >
        <img [src]="img.base64" [alt]="img.filename" class="preview-image" />
        <div class="image-overlay">
          <button
            class="remove-btn"
            (click)="removeImage(i); $event.stopPropagation()"
          >
            <svg>...</svg>
          </button>
        </div>
      </div>
    </div>
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>
</div>
<app-image-viewer
  *ngIf="showImageViewer"
  [images]="getAllImageBase64()"
  [imageKeys]="getAllImageKeys()"
  [allowDelete]="true"
  (close)="closeImageViewer()"
  (deleteImage)="onDeleteImage($event)"
>
</app-image-viewer>
