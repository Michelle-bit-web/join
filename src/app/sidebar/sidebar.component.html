<aside class="sidebar" role="navigation" aria-label="Main navigation">
  <div class="logo-section">
    <img src="assets/img/logo/logo.png" alt="Join Logo" class="logo" />
  </div>
  <nav class="navigation" *ngIf="isLoggedIn()" role="navigation" aria-label="Primary navigation">
    <ul role="list">
      <li routerLinkActive="active" role="listitem">
        <a routerLink="/summary" aria-label="Go to Summary page">
          <img src="assets/img/icons/summary-light.png" alt="Icon to Summary page" aria-hidden="true" />
          <span>Summary</span>
        </a>
      </li>
      <li routerLinkActive="active" role="listitem">
        <a routerLink="/board" aria-label="Go to Board page">
          <img src="assets/img/icons/board.png" alt="Icon to" aria-hidden="true" />
          <span>Board</span>
        </a>
      </li>
      <li routerLinkActive="active" role="listitem">
        <a routerLink="/add-task" aria-label="Go to Add Task page">
          <img src="assets/img/icons/add-task.png" alt="Icon to Add Task page" aria-hidden="true" />
          <span>Add Task</span>
        </a>
      </li>
      <li routerLinkActive="active" role="listitem">
        <a routerLink="/contacts" aria-label="Go to Contacts page">
          <img src="assets/img/icons/contacts.png" alt="Icon to Contacts page" aria-hidden="true" />
          <span>Contacts</span>
        </a>
      </li>
    </ul>
  </nav>
  <nav class="login-navigation" *ngIf="!isLoggedIn()" role="navigation" aria-label="Login navigation">
    <ul role="list">
      <li role="listitem">
        <a routerLink="/login" aria-label="Go to Login page">
          <img src="assets/img/svg/log-in.svg" alt="Icon to Login page" aria-hidden="true" />
          <span>Log In</span>
        </a>
      </li>
    </ul>
    <div class="login-legal-links" role="group" aria-label="Legal links">
      <a routerLink="/privacy-policy" aria-label="Read Privacy Policy">Privacy Policy</a>
      <a routerLink="/legal-notice" aria-label="Read Legal Notice">Legal notice</a>
    </div>
  </nav>
  <div class="legal-links" role="group" aria-label="Legal information">
    <a routerLink="/privacy-policy" aria-label="Read Privacy Policy">Privacy Policy</a>
    <a routerLink="/legal-notice" aria-label="Read Legal Notice">Legal notice</a>
  </div>
</aside>
