<main class="login-content" role="main">
  <app-login-header class="login-header"></app-login-header>
  <div
    class="dark-logo-wrapper"
    [@fadeOutWrapper]="logoState"
    [ngStyle]="{ background: isTouchDevice ? '#2a3647' : 'transparent' }"
  >
    <img
      [src]="
        isTouchDevice
          ? './assets/img/logo/logo.png'
          : './assets/img/logo/favicon.png'
      "
      alt="Join Logo"
      [ngClass]="{ load: pageLoaded }"
    />
  </div>
  <div class="main-content-wrapper">
    <section class="login-frame" role="form" aria-labelledby="login-heading">
      <h2 id="login-heading">Log in</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
        <div class="form-group-wrapper flex-center">
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  loginForm.get('email')?.invalid &&
                  loginForm.get('email')?.touched
              }"
            >
              <label for="email" class="sr-only">Email Address</label>
              <input
                id="email"
                type="email"
                placeholder="Email"
                formControlName="email"
                aria-describedby="email-error"
                [attr.aria-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/mail.png"
                alt="email icon"
                aria-hidden="true"
              />
            </div>
            <p
              id="email-error"
              class="error-message"
              *ngIf="
                loginForm.get('email')?.invalid &&
                loginForm.get('email')?.touched
              "
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("email") }}
            </p>
          </div>
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  loginForm.get('password')?.invalid &&
                  loginForm.get('password')?.touched
              }"
            >
              <label for="password" class="sr-only">Password</label>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Password"
                formControlName="password"
                aria-describedby="password-error"
                [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/lock.png"
                alt="password icon"
                aria-hidden="true"
                *ngIf="!loginForm.get('password')?.value"
              />
              <button
                type="button"
                class="input-icon toggle-eye"
                *ngIf="loginForm.get('password')?.value"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword"
              >
                <img
                  [src]="
                    showPassword
                      ? 'assets/img/icons/visibility.png'
                      : 'assets/img/icons/visibility-off.png'
                  "
                  alt="Toggle password visibility"
                  aria-hidden="true"
                />
              </button>
            </div>
            <p
              id="password-error"
              class="error-message"
              *ngIf="
                loginForm.get('password')?.invalid &&
                loginForm.get('password')?.touched
              "
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("password") }}
            </p>
          </div>
          <p class="error-message" *ngIf="errorMessage" aria-live="polite" role="alert">
            {{ errorMessage }}
          </p>
        </div>
        <div class="btn-wrapper" role="group" aria-label="Login options">
          <button
            type="submit"
            class="btn-login"
            [disabled]="loginForm.invalid || isLoading"
            [attr.aria-busy]="isLoading"
          >
            {{ isLoading ? "Loading..." : "Log in" }}
          </button>
          <button
            type="button"
            class="btn-guestlogin"
            (click)="onGuestLogin()"
            [disabled]="isLoading"
            [attr.aria-busy]="isLoading"
            aria-label="Log in as guest without creating an account"
          >
            {{ isLoading ? "Loading..." : "Guest Log in" }}
          </button>
        </div>
      </form>
    </section>
    <div class="lower-content-wrapper">
      <div class="wanna-signup-wrapper">
        <span>Not a Join user?</span>
        <div routerLink="/signup" class="btn-wrapper">
          <button class="btn-signup" aria-label="Navigate to sign up page">Sign up</button>
        </div>
      </div>
      <app-footer></app-footer>
    </div>
  </div>
</main>
