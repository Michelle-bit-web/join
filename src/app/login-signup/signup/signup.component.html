<main class="signup-content" role="main">
  <div class="upper-content">
    <div class="dark-logo-wrapper">
      <img src="./assets/img/logo/favicon.png" alt="Join Logo" />
    </div>
    <section class="signup-frame" role="form" aria-labelledby="signup-heading">
      <div class="signup-header">
        <button class="btn-back" (click)="onBackToLogin()" type="button" aria-label="Go back to login page">
          <img src="assets/img/icons/arrow-back.png" alt="" aria-hidden="true" />
        </button>
        <h2 id="signup-heading">Sign up</h2>
      </div>
      <form [formGroup]="signupform" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group-wrapper">
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  signupform.get('name')?.invalid &&
                  signupform.get('name')?.touched
              }"
            >
              <label for="name" class="sr-only">Full Name</label>
              <input
                id="name"
                type="text"
                placeholder="Name"
                formControlName="name"
                aria-describedby="name-error"
                [attr.aria-invalid]="signupform.get('name')?.invalid && signupform.get('name')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/person.png"
                alt=""
                aria-hidden="true"
              />
            </div>
            <p
              id="name-error"
              class="error-message"
              *ngIf="
                signupform.get('name')?.invalid &&
                signupform.get('name')?.touched
              "
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("name") }}
            </p>
          </div>
        </div>
        <div class="form-group-wrapper">
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  signupform.get('email')?.invalid &&
                  signupform.get('email')?.touched
              }"
            >
              <label for="email" class="sr-only">Email Address</label>
              <input
                id="email"
                type="email"
                placeholder="Email"
                formControlName="email"
                aria-describedby="email-error"
                [attr.aria-invalid]="signupform.get('email')?.invalid && signupform.get('email')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/mail.png"
                alt=""
                aria-hidden="true"
              />
            </div>
            <p
              id="email-error"
              class="error-message"
              *ngIf="
                signupform.get('email')?.invalid &&
                signupform.get('email')?.touched
              "
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("email") }}
            </p>
          </div>
        </div>
        <div class="form-group-wrapper">
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  signupform.get('password')?.invalid &&
                  signupform.get('password')?.touched
              }"
            >
              <label for="password" class="sr-only">Password</label>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Password"
                formControlName="password"
                aria-describedby="password-error"
                [attr.aria-invalid]="signupform.get('password')?.invalid && signupform.get('password')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/lock.png"
                alt=""
                aria-hidden="true"
                *ngIf="!signupform.get('password')?.value"
              />
              <button
                type="button"
                class="input-icon toggle-eye"
                *ngIf="signupform.get('password')?.value"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword"
              >
                <img
                  [src]="
                    showPassword
                      ? 'assets/img/icons/visibility.png'
                      : 'assets/img/icons/visibility-off.png'
                  "
                  alt=""
                  aria-hidden="true"
                />
              </button>
            </div>
            <p
              id="password-error"
              class="error-message"
              *ngIf="
                signupform.get('password')?.invalid &&
                signupform.get('password')?.touched
              "
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("password") }}
            </p>
          </div>
        </div>
        <div class="form-group-wrapper">
          <div>
            <div
              class="form-group"
              [ngClass]="{
                colorError:
                  signupform.get('confirmPassword')?.invalid &&
                  signupform.get('confirmPassword')?.touched
              }"
            >
              <label for="confirmPassword" class="sr-only">Confirm Password</label>
              <input
                id="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                placeholder="Confirm Password"
                formControlName="confirmPassword"
                aria-describedby="confirm-password-error"
                [attr.aria-invalid]="signupform.get('confirmPassword')?.invalid && signupform.get('confirmPassword')?.touched"
              />
              <img
                class="input-icon"
                src="assets/img/icons/lock.png"
                alt=""
                aria-hidden="true"
                *ngIf="!signupform.get('confirmPassword')?.value"
              />
              <button
                type="button"
                class="input-icon toggle-eye"
                *ngIf="signupform.get('confirmPassword')?.value"
                (click)="showConfirmPassword = !showConfirmPassword"
                [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
                [attr.aria-pressed]="showConfirmPassword"
              >
                <img
                  [src]="
                    showConfirmPassword
                      ? 'assets/img/icons/visibility.png'
                      : 'assets/img/icons/visibility-off.png'
                  "
                  alt=""
                  aria-hidden="true"
                />
              </button>
            </div>
            <p
              id="confirm-password-error"
              class="error-message"
              *ngIf="getValidationMessage('confirmPassword')"
              aria-live="polite"
              role="alert"
            >
              {{ getValidationMessage("confirmPassword") }}
            </p>
          </div>
        </div>
        <div class="form-group-wrapper">
          <label for="accept-privacy-checkbox" class="checkbox-label">
            <input
              id="accept-privacy-checkbox"
              type="checkbox"
              formControlName="privacyPolicy"
              aria-describedby="privacy-policy-text"
            />
            <span id="privacy-policy-text">I accept the
            <a routerLink="/privacy-policy" class="highlight" aria-label="Read privacy policy (opens in new page)">Privacy policy</a></span>
          </label>
        </div>
        <div class="btn-wrapper">
          <button
            class="btn-signup"
            type="submit"
            [disabled]="signupform.invalid || isLoading"
            [attr.aria-busy]="isLoading"
          >
            <ng-container *ngIf="!isLoading">Sign Up</ng-container>
            <ng-container *ngIf="isLoading">
              <span class="spinner" aria-hidden="true"></span>
              Signing up...
            </ng-container>
          </button>
        </div>
        <p class="success-message" *ngIf="successMessage" aria-live="polite" role="status">
          {{ successMessage }}
        </p>
        <p class="error-message" *ngIf="errorMessage" aria-live="polite" role="alert">
          {{ errorMessage }}
        </p>
      </form>
    </section>
  </div>
  <app-footer></app-footer>
</main>
